<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Car Detail</title>
  <link rel="stylesheet" href="css/detail.css" />
</head>

<body>
  <main class="page">
    <a href="index.html" class="back-btn">⬅ Back</a>

    <section class="detail-card">
      <img id="car-image" class="detail-image" alt="Car image" />

      <div class="car-info">
        <h2 id="car-title"></h2>
        <div id="car-colors" class="detail-colors"></div>
        <div class="car-spec-grid" id="car-spec-grid"></div>
      </div>
    </section>

    <section class="cost-box">
      <h3>คำนวณค่าใช้จ่ายคร่าว ๆ</h3>

      <div class="form-row">
        <div class="form-group">
          <label for="years">ระยะเวลาการใช้งาน (ปี)</label>
          <input id="years" type="number" value="5" min="1" />
        </div>

        <div class="form-group">
          <label for="insurance">ค่าประกันต่อปี</label>
          <input id="insurance" type="number" value="25000" step="1000" min="0" />
        </div>

        <div class="form-group">
          <label for="maintenance">ค่าบำรุงรักษาต่อปี</label>
          <input id="maintenance" type="number" value="5000" step="1000" min="0" />
        </div>

        <div class="form-group">
          <label for="km">เลขไมล์ต่อปี</label>
          <input id="km" type="number" value="15000" step="1000" min="0" />
        </div>
      </div>

      <div class="cost-result">
        <p id="running-cost-result-per-year">ค่าใช้จ่ายเพิ่มเติมรายปี: -</p>
        <p id="running-cost-result">ค่าใช้จ่ายเพิ่มเติมตลอดระยะเวลา: -</p>
      </div>
    </section>

    <section class="npv-output-box">
      <h3>คำนวณค่า NPV</h3>
      <div id="npv-summary"></div>
      <p id="npv-result">NPV: -</p>
    </section>
  </main>

  <script type="module" src="js/detail.js"></script>
</body>

</html>
